# cargo-deny configuration — supply-chain checks.
# CI gates on `check advisories bans sources` (see .github/workflows/ci.yml).
# License gating is configured below but not yet enforced (the ring/rustls
# license clarification is a follow-up) — see issue #60.

[advisories]
version = 2
# idna (via url, transitive through reqwest/hyper) and rsa (Marvin timing attack
# on private-key operations; no upstream fix). rsa is reached via sqlx-mysql and
# jsonwebtoken's RustCrypto backend — Ultimo only *verifies* RSA signatures with
# public keys, which the attack doesn't affect. Mirrors cargo-audit's --ignore
# flags in .github/workflows/ci.yml; keep both in sync.
ignore = [
  "RUSTSEC-2024-0421", # idna
  "RUSTSEC-2023-0071", # rsa
  # libsqlite3-sys < 0.39 (bundled C SQLite CVE). Pinned by sqlx: even sqlx
  # 0.9.0 requires libsqlite3-sys < 0.38, and the workspace can only have one
  # libsqlite3-sys (`links = "sqlite3"`). diesel-sqlite users can already get
  # >= 0.39 with diesel 2.4. Tracked in #204.
  "RUSTSEC-2026-0459", # libsqlite3-sys (C SQLite CVE)
  # Unmaintained (not vulnerabilities) transitive deps — low risk, no control.
  "RUSTSEC-2024-0370", # proc-macro-error
  "RUSTSEC-2024-0384", # instant (via notify)
  # chrono: only via rmcp (ultimo-cli's MCP server) and the unpublished
  # coverage-tool — not in the `ultimo` library. Revisit when rmcp moves off it.
  "RUSTSEC-2026-0543", # chrono
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  # webpki-roots ships Mozilla's CA certificate data under this permissive
  # data-license; it's data, not code, and is standard to allow.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
